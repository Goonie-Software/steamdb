name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test, coverage & vulns
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: "latest"
          install-go: false

      - name: Unit tests
        run: go test ./... -count=1

      - name: Coverage (internal packages ≥ 80%)
        run: |
          set -euo pipefail
          go test ./internal/... -count=1 -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out
          total="$(go tool cover -func=coverage.out | awk '/^total:/ { gsub(/%/, "", $3); print $3 }')"
          echo "Total coverage: ${total}%"
          awk -v t="$total" 'BEGIN {
            if ((t + 0) < 80) {
              printf "FAIL: coverage %.1f%% is below the 80%% threshold\n", t
              exit 1
            }
            printf "OK: coverage %.1f%% meets the 80%% threshold\n", t
          }'

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out
          if-no-files-found: ignore
